    NodeOperationalProfileDeclaredReceived:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              nodeId:
                type: string
              profileRevision:
                type: integer
                minimum: 1
              timezone:
                type: string
              operatingHoursByDay:
                type: object
                additionalProperties:
                  type: object
                  required:
                  - start
                  - end
                  properties:
                    start:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    end:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              holidays:
                type: array
                items:
                  type: string
                  format: date
              cutoffs:
                type: array
                items:
                  type: object
                  required:
                  - localTime
                  properties:
                    localTime:
                      type: string
                      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    days:
                      type: array
                      items:
                        type: string
                        enum:
                        - monday
                        - tuesday
                        - wednesday
                        - thursday
                        - friday
                        - saturday
                        - sunday
                    maxOrders:
                      type: integer
                      minimum: 1
              throughputCap:
                type: object
                required:
                - value
                - timeUnit
                properties:
                  value:
                    type: integer
                    minimum: 1
                  timeUnit:
                    type: string
                    enum:
                    - HOUR
                    - DAY
            required:
            - nodeId
            - profileRevision
            - timezone
            - operatingHoursByDay
            - holidays
            - cutoffs
            - throughputCap
