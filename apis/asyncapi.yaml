  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
        type:
          type: string
        subject:
          type: string
          description: 'The aggregate root id: departureId or loadId (published), the producer''s root id (consumed).'
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
    NodeType:
      type: string
      enum:
      - FULFILLMENT_CENTER
      - INBOUND_CROSS_DOCK
      - RETURNS_CENTER
      - SORTATION_CENTER
      - DELIVERY_STATION
      - AIR_HUB
    DepartureScheduledEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              departureId:
                type: string
              laneId:
                type: string
              kind:
                type: string
                enum:
                - PICKUP
                - LINEHAUL
                - AIR
              originNodeId:
                type: string
              destinationNodeId:
                type: string
              cutoffAt:
                type: string
                format: date-time
              departsAt:
                type: string
                format: date-time
              arrivesAt:
                type: string
                format: date-time
              capacityPackages:
                type: integer
                minimum: 0
            required:
            - departureId
            - laneId
            - kind
            - originNodeId
            - destinationNodeId
            - cutoffAt
            - departsAt
            - arrivesAt
            - capacityPackages
    DepartureCapacityChangedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              departureId:
                type: string
              capacityPackages:
                type: integer
                minimum: 0
              bookedPackages:
                type: integer
                minimum: 0
              remainingPackages:
                type: integer
                minimum: 0
            required:
            - departureId
            - capacityPackages
            - bookedPackages
            - remainingPackages
    DepartureCancelledEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              departureId:
                type: string
              reason:
                type: string
              cancelledAt:
                type: string
                format: date-time
            required:
            - departureId
            - reason
            - cancelledAt
    DepartureDepartedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              departureId:
                type: string
              departedAt:
                type: string
                format: date-time
            required:
            - departureId
            - departedAt
    DepartureArrivedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            properties:
              departureId:
                type: string
              arrivedAt:
                type: string
                format: date-time
            required:
            - departureId
            - arrivedAt
    LoadClosedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
