# Default values for linehaul-transportation.

replicaCount: 1

# Local kind clusters side-load the image (`kind load docker-image`), so the
# default pull policy never reaches a registry. Release images are on
# ghcr.io/iqvo/linehaul-transportation (override repository and tag).
image:
  repository: warehouse/linehaul-transportation
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# The service writes nothing to disk (migrations are embedded, logs go to
# stdout), so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: linehaul-transportation.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Routes only to the api Service. The operator supplies the Gateway parentRef.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the api Deployment, disabled by
# default. When enabled the Deployment omits replicas so the HPA owns them.
# N>1 has not been load-tested: the outbox relay claims rows with
# FOR UPDATE SKIP LOCKED, aggregate writes are version-guarded and the
# consumers use stable groups with an inbox, but the horizon roll runs in every
# replica (it is idempotent per departure).
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go). Every key maps 1:1 to one
# env var and is always rendered, with the binary's own default where it has one.
config:
  httpAddr: ":8080"                    # HTTP_ADDR
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn | error
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  outboxRelayInterval: "1s"
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes one outbox row so
  # a poison row cannot block the relay. 0 = unlimited.
  outboxMaxAttempts: 20
  # GENERATE_INTERVAL: how often the horizon roll (departure generation) runs.
  generateInterval: "1h"
  # PACKAGES_PER_ORDER: packages one order adds to a pickup (ADR 0002 A9), >= 1.
  packagesPerOrder: 1
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Plain seconds or a number with s, ms or m (the chart sizes the pod's
  # terminationGracePeriodSeconds from it).
  shutdownDrainDelay: "5s"
  # The three consumer group ids are REQUIRED: empty = the chart refuses to
  # render and the binary refuses to boot. Use a STABLE, service-prefixed id
  # (never the pod name) so a rescheduled pod resumes from its committed
  # offsets.
  nodeTopologyConsumerGroup: ""        # NODE_TOPOLOGY_CONSUMER_GROUP
  orderSourcingConsumerGroup: ""       # ORDER_SOURCING_CONSUMER_GROUP
  shippingAndTrackingConsumerGroup: ""  # SHIPPING_AND_TRACKING_CONSUMER_GROUP

# The chart refuses to render unless database.url or database.existingSecret
# is set (templates/_helpers.tpl: linehaul-transportation.requireDatabase).
# DATABASE_URL always comes from a Secret via secretKeyRef.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same secret, of a DIRECT (non-pooled, session-mode) Postgres
  # connection string used ONLY for the startup migrations (golang-migrate
  # takes a session-scoped advisory lock that transaction pooling cannot
  # honour). Rendered with `optional: true`: a secret without the key still
  # starts the pod and the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is MANDATORY (outbox relay, consumers, /readyz). The chart
# refuses to render without it (comma-separated host:port list).
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable and any variable that has a dedicated value above.
extraEnv: []

# The boot migrations retry for up to ~30s while Postgres comes up
# (cmd/api migrate: 30 attempts, 1s apart). periodSeconds * failureThreshold
# gives the startup probe a window above that. Once it succeeds, liveness takes
# over; readiness uses /readyz (Postgres ping + Kafka metadata; flipped to
# not-ready as the FIRST step of graceful shutdown).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 45

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's graceful shutdown (cmd/api/serve.go), sequential:
# SHUTDOWN_DRAIN_DELAY (default 5s) + HTTP drain (10s) + workers drain (10s:
# outbox relay, horizon roll and the three consumers stop together) = 25s.
# The chart refuses a value that does not EXCEED drain delay + 20s.
terminationGracePeriodSeconds: 40

nodeSelector: {}
tolerations: []
affinity: {}
