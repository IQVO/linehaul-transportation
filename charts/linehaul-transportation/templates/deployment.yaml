{{- include "linehaul-transportation.requireRealRuntime" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linehaul-transportation.fullname" . }}
  labels:
    {{- include "linehaul-transportation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "linehaul-transportation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "linehaul-transportation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "linehaul-transportation.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "linehaul-transportation.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Every config.* value also reaches cmd/api through the chart
          # ConfigMap; the explicit `env` entries below win over envFrom for
          # the same key and carry the same values. The checksum/config
          # annotation above rolls the pods when the ConfigMap changes.
          # tests/render_test.sh asserts the mount and that every variable
          # cmd/api reads is rendered.
          envFrom:
            - configMapRef:
                name: {{ include "linehaul-transportation.fullname" . }}
          # Env contract verified against cmd/api/main.go's header comment and
          # cmd/api/config.go.
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ .Values.config.outboxRelayInterval | quote }}
            # The relay excludes a row after this many failures (0 = unlimited).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            - name: GENERATE_INTERVAL
              value: {{ .Values.config.generateInterval | quote }}
            - name: PACKAGES_PER_ORDER
              value: {{ .Values.config.packagesPerOrder | quote }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.config.shutdownDrainDelay | quote }}
            # Observability env (fleet standard): the same three for every
            # component, plus ENVIRONMENT for deployment.environment.name.
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            # The three consumers always run. The group ids come from values,
            # never a literal, and are mandatory (the chart refuses an empty
            # one): a stable id is what makes a rescheduled pod resume from
            # its committed offsets.
            - name: NODE_TOPOLOGY_CONSUMER_GROUP
              value: {{ .Values.config.nodeTopologyConsumerGroup | quote }}
            - name: ORDER_SOURCING_CONSUMER_GROUP
              value: {{ .Values.config.orderSourcingConsumerGroup | quote }}
            - name: SHIPPING_AND_TRACKING_CONSUMER_GROUP
              value: {{ .Values.config.shippingAndTrackingConsumerGroup | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "linehaul-transportation.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # A direct (non-pooled) connection used only for the migration
            # step, never for the runtime pool. `optional: true` so a secret
            # without this key still starts the pod: the binary falls back to
            # DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "linehaul-transportation.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            # Mandatory: the relay, the consumers and /readyz all dial Kafka.
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
