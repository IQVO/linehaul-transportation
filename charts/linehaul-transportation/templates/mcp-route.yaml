{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through Kong (ADR 0008).

Host contract: /api/mcp/<context> -> Service <context>-mcp:8090, prefix
rewritten to /mcp (the SDK's canonical endpoint on cmd/mcp in this fleet;
healthz deliberately stays off the host -- it is a Kubernetes probe concern,
not a public endpoint).

NO auth plugin -- endpoints are unauthenticated by fleet-wide decision
(2026-09-11). This chart carries no KongPlugin resources; attach any via
annotation from warehouse-infra if a fleet policy ever demands it.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "linehaul-transportation.mcpFullname" . }}
  labels:
    {{- include "linehaul-transportation.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "linehaul-transportation.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
