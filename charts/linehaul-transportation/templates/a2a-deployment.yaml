{{- if .Values.a2a.enabled }}
{{- include "linehaul-transportation.requireDatabase" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linehaul-transportation.a2aFullname" . }}
  labels:
    {{- include "linehaul-transportation.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "linehaul-transportation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "linehaul-transportation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "linehaul-transportation.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "linehaul-transportation.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/a2a/main.go: A2A_ADDR,
          # A2A_AGENT_URL, LOG_LEVEL, DATABASE_URL and (migration step only)
          # MIGRATIONS_DATABASE_URL. cmd/a2a has no auth env, starts no outbox
          # relay, runs no horizon roll or local-copy consumer and never dials
          # Kafka (no KAFKA_BROKERS, no consumer groups, no EVENT_PUBLISHER
          # here): the surface is read-only (ADR 0011). It never mounts the api
          # ConfigMap.
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # MANDATORY (ADR 0011): the absolute URL advertised on the Agent
            # Card. Defaults to this release's in-cluster Service DNS and is
            # overridable through a2a.agentUrl.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "linehaul-transportation.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "linehaul-transportation.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/a2a runs the idempotent embedded migrations on start (like
            # cmd/api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "linehaul-transportation.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
          # GET /healthz is served by cmd/a2a, so the probes have a cheap
          # target. The startup probe covers the boot retries (migrations and
          # the first pool ping retry for up to ~30s while Postgres comes up).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
